<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" lang="zh-CN" role="img" aria-label="企业功能 — 规模化与质量把关 — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="274" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="273" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">企业功能 — 规模化与质量把关</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">技能</text>
  <text class="t" x="204" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">做什么</text>
  <text class="t" x="419" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">输入 → 输出</text>
  <text class="t" x="724" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">模型</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">batch-image</text>
  <text class="t" x="204" y="102" font-size="13" fill="#edebfa" text-anchor="start">多商品批量生图流水线</text>
  <text class="t" x="419" y="102" font-size="13" fill="#edebfa" text-anchor="start">商品清单 CSV → 整批统一视觉的商拍图</text>
  <rect x="724" y="89" width="98" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="730" y="102" font-size="12" fill="#edebfa" text-anchor="start">seedream-5.0</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="137" font-size="13" fill="#edebfa" text-anchor="start">detect-task</text>
  <text class="t" x="204" y="137" font-size="13" fill="#edebfa" text-anchor="start">投前检测（AI 图质检）</text>
  <text class="t" x="419" y="137" font-size="13" fill="#edebfa" text-anchor="start">待检图 → 风险报告 + prompt 修正句</text>
  <rect x="724" y="124" width="120" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="730" y="137" font-size="12" fill="#edebfa" text-anchor="start">claude-sonnet-5</text>
  <text class="t" x="28" y="172" font-size="13" fill="#edebfa" text-anchor="start">platform-compliance</text>
  <text class="t" x="204" y="172" font-size="13" fill="#edebfa" text-anchor="start">上架前合规校验与自动修复</text>
  <text class="t" x="419" y="172" font-size="13" fill="#edebfa" text-anchor="start">待上架图 → 各平台通过/驳回报告 +</text>
  <text class="t" x="419" y="190" font-size="13" fill="#edebfa" text-anchor="start">合规图</text>
  <text class="t" x="724" y="172" font-size="13" fill="#edebfa" text-anchor="start">无（读像素）</text>
  <rect x="20" y="201" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="225" font-size="13" fill="#edebfa" text-anchor="start">brand-kit</text>
  <text class="t" x="204" y="225" font-size="13" fill="#edebfa" text-anchor="start">店铺视觉统一</text>
  <text class="t" x="419" y="225" font-size="13" fill="#edebfa" text-anchor="start">brand.yaml → 全技能共用的画面约束</text>
  <text class="t" x="724" y="225" font-size="13" fill="#edebfa" text-anchor="start">无（纯规范）</text>
  <rect x="28" y="236" width="824" height="1" fill="#35334a"/>
</svg>
