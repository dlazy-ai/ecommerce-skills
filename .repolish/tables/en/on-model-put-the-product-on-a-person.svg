<svg xmlns="http://www.w3.org/2000/svg" width="880" height="275" viewBox="0 0 880 275" lang="en" role="img" aria-label="On-model — put the product on a person — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="275" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="274" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">ON-MODEL — PUT THE PRODUCT ON A PERSON</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">SKILL</text>
  <text class="t" x="173" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">WHAT IT DOES</text>
  <text class="t" x="451" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">IN → OUT</text>
  <text class="t" x="746" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">MODEL</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">flat-lay</text>
  <text class="t" x="173" y="102" font-size="13" fill="#edebfa" text-anchor="start">Garment flat-lay, worn</text>
  <text class="t" x="451" y="102" font-size="13" fill="#edebfa" text-anchor="start">flat-lay + pose reference →</text>
  <text class="t" x="451" y="120" font-size="13" fill="#edebfa" text-anchor="start">on-model catalog shot</text>
  <rect x="746" y="89" width="91" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="752" y="102" font-size="12" fill="#edebfa" text-anchor="start">gpt-image-2</text>
  <rect x="20" y="131" width="840" height="53" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="155" font-size="13" fill="#edebfa" text-anchor="start">wear-everything</text>
  <text class="t" x="173" y="155" font-size="13" fill="#edebfa" text-anchor="start">Shoes, bags and accessories worn</text>
  <text class="t" x="451" y="155" font-size="13" fill="#edebfa" text-anchor="start">product + model reference →</text>
  <text class="t" x="451" y="173" font-size="13" fill="#edebfa" text-anchor="start">worn-on-model shot</text>
  <rect x="746" y="142" width="91" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="752" y="155" font-size="12" fill="#edebfa" text-anchor="start">gpt-image-2</text>
  <text class="t" x="28" y="208" font-size="13" fill="#edebfa" text-anchor="start">image-fusion</text>
  <text class="t" x="173" y="208" font-size="13" fill="#edebfa" text-anchor="start">Free styling across items</text>
  <text class="t" x="451" y="208" font-size="13" fill="#edebfa" text-anchor="start">up to 8 separate items → one</text>
  <text class="t" x="451" y="226" font-size="13" fill="#edebfa" text-anchor="start">complete styled look</text>
  <rect x="746" y="195" width="98" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="752" y="208" font-size="12" fill="#edebfa" text-anchor="start">seedream-5.0</text>
