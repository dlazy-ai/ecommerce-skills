  <text class="t" x="450" y="297" font-size="13" fill="#edebfa" text-anchor="start">brand.yaml → constraints</text>
  <text class="t" x="450" y="315" font-size="13" fill="#edebfa" text-anchor="start">shared by every skill</text>
  <text class="t" x="696" y="297" font-size="13" fill="#edebfa" text-anchor="start">none (spec only)</text>
  <rect x="28" y="326" width="824" height="1" fill="#35334a"/>
