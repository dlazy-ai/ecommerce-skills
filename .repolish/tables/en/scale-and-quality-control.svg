  <text class="t" x="450" y="102" font-size="13" fill="#edebfa" text-anchor="start">product list CSV → a whole</text>
  <text class="t" x="450" y="120" font-size="13" fill="#edebfa" text-anchor="start">batch on one visual system</text>
  <rect x="696" y="89" width="98" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="702" y="102" font-size="12" fill="#edebfa" text-anchor="start">seedream-5.0</text>
  <rect x="20" y="131" width="840" height="71" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="155" font-size="13" fill="#edebfa" text-anchor="start">detect-task</text>
  <text class="t" x="204" y="155" font-size="13" fill="#edebfa" text-anchor="start">Pre-launch AI-image QC</text>
  <text class="t" x="450" y="155" font-size="13" fill="#edebfa" text-anchor="start">candidate image → risk</text>
  <text class="t" x="450" y="173" font-size="13" fill="#edebfa" text-anchor="start">report + prompt fix</text>
  <text class="t" x="450" y="191" font-size="13" fill="#edebfa" text-anchor="start">sentences</text>
  <rect x="696" y="142" width="120" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="702" y="155" font-size="12" fill="#edebfa" text-anchor="start">claude-sonnet-5</text>
  <text class="t" x="28" y="226" font-size="13" fill="#edebfa" text-anchor="start">platform-compliance</text>
  <text class="t" x="204" y="226" font-size="13" fill="#edebfa" text-anchor="start">Marketplace spec check and</text>
  <text class="t" x="204" y="244" font-size="13" fill="#edebfa" text-anchor="start">auto-fix</text>
  <text class="t" x="450" y="226" font-size="13" fill="#edebfa" text-anchor="start">candidate image →</text>
  <text class="t" x="450" y="244" font-size="13" fill="#edebfa" text-anchor="start">per-marketplace pass/reject</text>
  <text class="t" x="450" y="262" font-size="13" fill="#edebfa" text-anchor="start">report + fixed image</text>
  <text class="t" x="696" y="226" font-size="13" fill="#edebfa" text-anchor="start">none (reads pixels)</text>
  <rect x="20" y="273" width="840" height="53" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="297" font-size="13" fill="#edebfa" text-anchor="start">brand-kit</text>
