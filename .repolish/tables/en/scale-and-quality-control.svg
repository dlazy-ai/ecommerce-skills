  <text class="t" x="450" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">IN → OUT</text>
  <text class="t" x="696" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">MODEL</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">batch-image</text>
