name: Bug report
description: Something in ecommerce-skills does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem
      placeholder: |-
        1.
        2.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of ecommerce-skills are you running
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system
